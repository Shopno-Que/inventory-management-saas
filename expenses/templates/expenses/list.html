{% extends "layouts/store_base.html" %}
{% block title %}{{store.name}} Order List{% endblock %}
{% block main_content %}
<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">

  <div>
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">খরচসমূহ</h1>
      <p class="text-slate-500 mt-1">আপনার স্টোরের সকল খরচের তালিকা দেখুন।</p>

      <!-- Search -->
      <form method="get" action="{% url 'expenses:expense_list' store.id %}"
            class="relative w-full md:w-96 mt-3">

          <input 
              type="search"
              name="q"
              value="{{ request.GET.q|default:'' }}"
              placeholder="খরচের পরিমাণ দিয়ে খুঁজুন..."
              class="w-full pl-11 pr-12 py-3 rounded-xl border border-slate-200 shadow-sm focus:border-indigo-500 focus:outline-none"
          >

          <svg class="w-5 h-5 text-slate-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>

          <button type="submit"
                  class="absolute right-2 top-2.5 bg-indigo-500 text-white px-4 py-1 rounded-lg hover:bg-indigo-600">
              Search
          </button>
      </form>
  </div>

  <!-- Add Expense Button -->
  <div>
      <a href="{% url 'expenses:add' store.id %}"
         class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          নতুন খরচ
      </a>
  </div>

</div>
<!-- ORDER TABLE -->
<div class="bg-white table-container rounded-xl border border-slate-200 shadow-sm">
    <div class="overflow-x-auto">
        {% include "partials/expenses_table.html" %}
    </div>
</div>

{% endblock %}
