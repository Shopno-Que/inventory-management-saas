{% extends "layouts/store_base.html" %}
{% block title %}{{store.name}} Product List{% endblock %}
{% block main_content %}

<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
  <div>
      <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Products</h1>
      <p class="text-slate-500 mt-1">View your store's product list.</p>
    
      <form method="get" action="{% url 'catalog:product_list' store.id %}" class="relative w-full md:w-96 mt-3" role="search" aria-label="Search products">
        <label for="product-search" hidden class="sr-only">Search</label>

        <input 
            type="search" 
            name="q" 
            {% if request.GET.q %}
            autofocus 
            onfocus="this.setSelectionRange(this.value.length, this.value.length)"
            {% endif %}
            id="product-search" 
            value="{{ request.GET.q|default:'' }}"
            placeholder="Search by product name or SKU..." 
            class="w-full pl-11 pr-12 py-3 block appearance-none rounded-xl border border-slate-200 placeholder-slate-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 transition"
        >

        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-3.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>

        <button type="submit" class="absolute right-2 top-2.5 bg-indigo-500 text-white px-4 py-1 rounded-lg hover:bg-indigo-600 focus:ring-2 focus:ring-indigo-500">
            Search
        </button>
    </form>

  </div>
  <div class="flex gap-2">

      <a href="{% url 'catalog:product_create' store.id %}" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-indigo-700 shadow-lg shadow-indigo-100 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
          </svg>
          New Product
      </a>
  </div>
</div>
<!-- Product Table -->
<div class="bg-white table-container rounded-xl border border-slate-200 shadow-sm">
    <div class="overflow-x-auto">
        {% include "partials/product_table.html" %}
    </div>
</div>

{% endblock %}
