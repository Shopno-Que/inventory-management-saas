<h1>{{ store.name }}</h1>
<p>Your role: {{ team.role }}</p>

<h2>Team Members:</h2>
<ul>
    {% for member in members %}
    <li>{{ member.user.email }} ({{ member.role }})</li>
    {% endfor %}
</ul>

{% if team.role == "owner" %}
<a href="{% url 'store:invite_staff' store.id %}">Invite Staff</a>
{% endif %}
<a href="{% url 'user:profile' %}">Back to Profile</a>
