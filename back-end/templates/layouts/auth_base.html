{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}{% endblock %} - Hishab Khata</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
    <link rel="stylesheet" href="{% static 'tailwind/output.css' %}">
    {% block extra_head %}{% endblock %}
</head>

<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <main>
        {% block content %}{% endblock %}
    </main>
    {% include "partials/chatbox.html" %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
