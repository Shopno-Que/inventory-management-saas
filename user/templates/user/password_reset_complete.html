{% extends "layouts/auth_base.html" %}
{% block title %}Password Reset Done{% endblock %}
{% block content %}
<div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <!-- Success Celebration Icon -->
    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-green-100 mb-6 border-4 border-white shadow-lg">
        <svg class="h-10 w-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>
    
    <h2 class="text-3xl font-bold tracking-tight text-slate-900">Congratulations!</h2>
    <h3 class="text-xl font-semibold text-slate-800 mt-2">Password updated successfully</h3>
    <p class="mt-4 text-md text-slate-600 px-4">
        The security of your account has been confirmed. You can now login using your new password.</p>
</div>

<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
  <div class="bg-white py-10 px-6 shadow-xl shadow-slate-200/50 border border-slate-100 sm:rounded-xl sm:px-12 text-center">
      <div class="space-y-6">
          <!-- Login Button -->
          <div class="pt-2">
              <a href="{% url 'user:signin' %}" 
                  class="flex w-full justify-center rounded-xl bg-indigo-600 px-4 py-3 text-md font-semibold text-white shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition transform active:scale-[0.98]">
                  Login now</a>
          </div>
      </div>
  </div>
</div>
{% endblock %}
