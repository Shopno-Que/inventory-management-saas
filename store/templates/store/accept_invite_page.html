{% extends "layouts/auth_base.html" %}
{% block title %}Invitation Accept Page{% endblock %}
{% block content %}
<div class="flex items-center justify-center p-6">
    <div class="bg-white max-w-sm w-full rounded-xl shadow-lg border border-slate-200 overflow-hidden">
        <div class="p-8 text-center">
            <!-- আইকন -->
            <div class="w-16 h-16 bg-indigo-100 rounded-xl flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
            </div>

            <!-- কন্টেন্ট -->
            <h1 class="text-2xl font-bold text-slate-900 mb-2">{{ invite.store.name }}-এ আমন্ত্রণ</h1>
            <p class="text-slate-600 mb-8">আপনাকে এই স্টোরে একজন <span class="font-bold text-slate-900 text-indigo-600">{{ invite.role }}</span> হিসেবে যোগ দেওয়ার জন্য আমন্ত্রণ জানানো হয়েছে।</p>

            <!-- অ্যাকশন বাটনসমূহ -->
            <div class="flex flex-col gap-3">
                <form method="post" action="{% url 'store:accept_invite' invite.token %}">
                    {% csrf_token %}
                    <button type="submit" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors">
                        আমন্ত্রণ গ্রহণ করুন
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
